[project]
name = "issue-triage-bot"
version = "2.0.0.dev0"
description = "Deterministic GitHub issue triage with untrusted structured proposals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1", "pyyaml>=6,<7", "typer>=0.20,<1"]

[project.scripts]
triage = "issue_triage_bot.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.18,<2", "types-PyYAML>=6,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_triage_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
